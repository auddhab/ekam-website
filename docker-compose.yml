# Ekam Foundation website - TrueNAS SCALE (24.10+), behind your existing
# Nginx Proxy Manager. NPM keeps ports 80/443; this app just serves the
# files on an internal port and NPM does the domain + HTTPS.
#
#   Apps -> Discover Apps -> Custom App -> "Install via YAML" -> paste this.
#
# Dataset used here:  Raid HDD / ekam-web   ->   /mnt/Raid HDD/ekam-web
# First, in a TrueNAS shell:   mkdir -p "/mnt/Raid HDD/ekam-web/git"

services:
  git-sync:
    image: registry.k8s.io/git-sync/git-sync:v4.4.0
    container_name: ekam-gitsync
    restart: unless-stopped
    user: "0"
    command:
      - --repo=https://github.com/auddhab/ekam-website
      - --ref=main
      - --root=/git
      - --link=current
      - --period=60s
      - --depth=1
    volumes:
      - "/mnt/Raid HDD/ekam-web/git:/git"

  web:
    image: caddy:2-alpine
    container_name: ekam-web
    restart: unless-stopped
    depends_on:
      - git-sync
    command: caddy file-server --root /srv/current/site --listen :80 --browse=false
    ports:
      - "8088:80"          # <- point Nginx Proxy Manager at  <NAS-IP>:8088
    volumes:
      - "/mnt/Raid HDD/ekam-web/git:/srv:ro"
