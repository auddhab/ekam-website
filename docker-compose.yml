# Ekam Foundation website - SINGLE container.
# One container clones this repo, pulls it every 60s, and serves site/ on :80.
# Works both with "Install via YAML" and with the plain Custom App *form*
# (field-by-field values are in README.md -> "Custom App form").
#
# Runs behind your existing Nginx Proxy Manager: NPM keeps 80/443, this
# publishes on host port 8088, and an NPM Proxy Host maps ekamfdn.org -> :8088.
#
# Before installing, in a TrueNAS shell:
#   mkdir -p "/mnt/Raid HDD/ekam-web/data"

services:
  ekam-web:
    image: caddy:2-alpine
    container_name: ekam-web
    restart: unless-stopped
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >
        apk add --no-cache git >/dev/null 2>&1;
        [ -d /site/.git ] || git clone --depth 1 https://github.com/auddhab/ekam-website /site;
        ( while true; do sleep 60; git -C /site pull -q 2>/dev/null || true; done ) &
        exec caddy file-server --root /site/site --listen :80 --browse=false
    ports:
      - "8088:80"
    volumes:
      - "/mnt/Raid HDD/ekam-web/data:/site"
